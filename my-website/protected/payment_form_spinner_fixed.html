<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile Money Payment</title>
  <style>
  * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: black;
  color: white;
}
     
/* =========================
   HEADER
========================== */
.deposit-header {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}


    .deposit-title {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    }
    .back-btn {
    position: absolute;
    left: 13px;
    top: 13px;
    width: 25px;
    height: 25px;
    background: transparent;
    border: none;
    cursor: pointer;
    }
    .back-btn::before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border-left: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg);
    left: 5px;
    top: 5px;
    }/* =========================
       DEPOSIT FULL SCREEN
    ========================== */
    .deposit-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 8%;

        background: #000;

        z-index: 999999;

        display: block;
        overflow-y: auto;
    }

  

    /* Main deposit container */
    .deposit-page {
        min-height: 100dvh;
        width: 100%;
        padding: 0 11px 18px;
        position: relative;
    }


.wrap {
  min-height: 100vh;
  margin-top: 40px;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: black;
  border-radius: 18px;
  padding: 2px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
}

h1 {
  margin: 8px 0;
  font-size: 25px;
}


.group {
  margin: 18px 0;
}

.group label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 7px;
}

.group input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

.group input:focus {
  border-color: #2457d6;
  box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.12);
}

small {
  display: block;
  color: #667085;
  margin-top: 6px;
}

.btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2457d6;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: black;
  line-height: 1.45;
  font-size: 14px;
}

.status.processing {
  background: #fff8e6;
  color: #8a5a00;
}

.status.success {
  background: #ecfdf3;
  color: #067647;
}

.status.error {
  background: #fef3f2;
  color: #b42318;
}

.details {
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #eaecf0;
  border-radius: 10px;
  background: #fafafa;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 7px 0;
}

.row + .row {
  border-top: 1px solid #eaecf0;
}

.row span {
  color: #667085;
  font-size: 12px;
}

.row strong {
  font-size: 12px;
  word-break: break-all;
}

.hidden {
  display: none;
}
.btn {
        width: 100%;
        height: 48px;

        margin-top: 80%;

        border: 1px solid #0b96ff;
        border-radius: 7px;

        background: rgba(0, 14, 27, 0.9);

        color: white;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 0 6px rgba(0, 150, 255, 0.65),
            inset 0 0 7px rgba(0, 100, 255, 0.15);

        transition: 0.2s ease;
  }
  </style>
</head>
<body>
  <div class="deposit-overlay">
        <!-- HEADER -->
        <div class="deposit-header">

            <a class="back-btn" href="/protected/user-account.html"></a>

            <div class="deposit-title">
                Make a Payment
            </div>
        </div>
        </div>
  <main class="wrap">
    <section class="card">
      

      <form id="paymentForm">
        <input id="userId" type="hidden">
      
        <div class="group">
          <label for="phone">Mobile Money Number</label>
          <input id="phone" type="tel" inputmode="tel" placeholder="0771*****" required>
          <small>MTN or Airtel Uganda</small>
        </div>
        <div class="group">
          <label for="amount">Amount (UGX)</label>
          <input id="amount" type="number" min="1" max="10000000" step="1" placeholder="Enter Amount to deposit" required>
          <small>Minimum Deposit UGX 15,000</small>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>

      <div id="details" class="details hidden">
        <div class="row" style="display: none;"><span>Reference</span><strong id="reference">—</strong></div>
        <div class="row"><span>Status</span><strong id="state">—</strong></div>
      </div>
      </form>
      
<button class="btn" id="payBtn" type="button">Pay Now</button>
      
    </section>
  </main>


  <script>
    const API_BASE = 'https://marzpay-api.investinginaionline.workers.dev';

    const userId = document.getElementById('userId'),
          phone = document.getElementById('phone'),
          amount = document.getElementById('amount'),
          payBtn = document.getElementById('payBtn'),
          statusEl = document.getElementById('status'),
          details = document.getElementById('details'),
          referenceEl = document.getElementById('reference'),
          stateEl = document.getElementById('state');

    let timer = null,
        active = false;

    // Finds the logged-in user's ID. Checks (in order): a hidden field value,
    // window globals set by your app, URL ?userId=, then localStorage/sessionStorage.
    function resolveUserId() {
      const fromWindow = window.currentUserId || window.userId || window.uid ||
                         (window.currentUser && (window.currentUser.uid || window.currentUser.id)) ||
                         (window.auth && window.auth.currentUser && window.auth.currentUser.uid);
      const fromUrl = new URLSearchParams(location.search).get('userId');
      const keys = ['userId', 'uid', 'user_id', 'currentUserId'];
      let fromStore = '';
      for (const k of keys) {
        fromStore = localStorage.getItem(k) || sessionStorage.getItem(k) || '';
        if (fromStore) break;
      }
      return String(userId.value || fromWindow || fromUrl || fromStore || '').trim();
    }

    function message(t, c = '') {
      statusEl.textContent = t;
      statusEl.className = 'status ' + c;
    }

    function stop() {
      active = false;
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
    }

    function busy(v) {
      payBtn.disabled = v;
      payBtn.textContent = v ? 'Processing...' : 'Pay Now';
    }

    payBtn.addEventListener('click', async e => {
      e.preventDefault();
      stop();

      const uid = resolveUserId(),
            ph = phone.value.trim(),
            amt = Number(amount.value);

      if (!uid) return message('Could not identify your account. Please log in again.', 'error');
      if (!ph) return message('Please enter your mobile-money number.', 'error');
      if (!Number.isInteger(amt) || amt < 1 || amt > 10000000) {
        return message('Please enter a valid amount (maximum UGX 10,000,000).', 'error');
      }

      busy(true);
      message('Starting payment...', 'processing');

      try {
        const r = await fetch(API_BASE + '/collect-money', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: uid, phone: ph, amount: amt })
        });
        const d = await r.json();

        if (!r.ok || d.status !== 'success') {
          throw new Error(d.message || 'Payment could not be initiated.');
        }

        const t = d?.data?.transaction || {},
              ref = t.reference || d?.data?.reference || '';

        if (!ref) throw new Error('MarzPay did not return a reference.');

        referenceEl.textContent = ref;
        stateEl.textContent = t.status || 'processing';
        details.classList.remove('hidden');
        message('Payment request sent. Approve the MTN/Airtel prompt on your phone.', 'processing');

        poll(ref);
      } catch (err) {
        message(err.message || 'Unable to start payment.', 'error');
        busy(false);
      }
    });

    function poll(ref) {
      active = true;
      let n = 0;

      (async function check() {
        if (!active) return;
        n++;

        try {
          const r = await fetch(API_BASE + '/payment-status/' + encodeURIComponent(ref), { cache: 'no-store' }),
                d = await r.json();

          if (!r.ok || d.status !== 'success') {
            throw new Error(d.message || 'Status check failed.');
          }

          const p = d.data || {},
                s = p.status || 'processing';

          stateEl.textContent = s;

          if (s === 'paid') {
            stop();
            message('Payment successful.', 'success');
            busy(false);
            return;
          }
          if (s === 'failed') {
            stop();
            message('Payment failed.', 'error');
            busy(false);
            return;
          }
          if (s === 'cancelled') {
            stop();
            message('Payment was cancelled.', 'error');
            busy(false);
            return;
          }

          message('Waiting for payment confirmation. Approve the prompt on your phone.', 'processing');

          if (n >= 60) {
            stop();
            message('Confirmation is taking longer than expected. Check the payment status before trying again.', 'processing');
            busy(false);
            return;
          }

          timer = setTimeout(check, 3000);
        } catch (err) {
          if (n >= 60) {
            stop();
            message('Unable to confirm the payment automatically. Check the payment status before retrying.', 'error');
            busy(false);
            return;
          }
          timer = setTimeout(check, 3000);
        }
      })();
    }
  </script>

    <script type="module" src="/protected-assets/firestoreadminlogic.js"></script>
</body>
</html>
