<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile Money Payment</title>
  <style>
  * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: black;
  color: white;
}
     
/* =========================
   HEADER
========================== */
.deposit-header {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}


    .deposit-title {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    }
    .back-btn {
    position: absolute;
    left: 13px;
    top: 13px;
    width: 25px;
    height: 25px;
    background: transparent;
    border: none;
    cursor: pointer;
    }
    .back-btn::before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border-left: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg);
    left: 5px;
    top: 5px;
    }/* =========================
       DEPOSIT FULL SCREEN
    ========================== */
    .deposit-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 8%;

        background: #000;

        z-index: 999999;

        display: block;
        overflow-y: auto;
    }

  

    /* Main deposit container */
    .deposit-page {
        min-height: 100dvh;
        width: 100%;
        padding: 0 11px 18px;
        position: relative;
    }


.wrap {
  min-height: 100vh;
  margin-top: 40px;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: black;
  border-radius: 18px;
  padding: 2px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
}

h1 {
  margin: 8px 0;
  font-size: 25px;
}


.group {
  margin: 18px 0;
}

.group label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 7px;
}

.group input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

.group input:focus {
  border-color: #2457d6;
  box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.12);
}

small {
  display: block;
  color: #667085;
  margin-top: 6px;
}

.btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2457d6;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: black;
  line-height: 1.45;
  font-size: 14px;
}

.status.processing {
  background: #fff8e6;
  color: #8a5a00;
}

.status.success {
  background: #ecfdf3;
  color: #067647;
}

.status.error {
  background: #fef3f2;
  color: #b42318;
}

.details {
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #eaecf0;
  border-radius: 10px;
  background: #fafafa;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 7px 0;
}

.row + .row {
  border-top: 1px solid #eaecf0;
}

.row span {
  color: #667085;
  font-size: 12px;
}

.row strong {
  font-size: 12px;
  word-break: break-all;
}

.hidden {
  display: none;
}
.btn {
        width: 100%;
        height: 48px;

        margin-top: 80%;

        border: 1px solid #0b96ff;
        border-radius: 7px;

        background: rgba(0, 14, 27, 0.9);

        color: white;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 0 6px rgba(0, 150, 255, 0.65),
            inset 0 0 7px rgba(0, 100, 255, 0.15);

        transition: 0.2s ease;
  }
  </style>
</head>
<body>
  <div class="deposit-overlay">
        <!-- HEADER -->
        <div class="deposit-header">

            <a class="back-btn" href="user-account.html"></a>

            <div class="deposit-title">
                Make a Payment
            </div>
        </div>
        </div>
  <main class="wrap">
    <section class="card">
      

      <form id="paymentForm">
      
        <div class="group">
          <label for="phone">Mobile Money Number</label>
          <input id="phone" type="tel" inputmode="tel" placeholder="0771*****" required>
          <small>MTN or Airtel Uganda</small>
        </div>
        <div class="group">
          <label for="amount">Amount (UGX)</label>
          <input id="amount" type="number" min="500" max="10000000" step="1" placeholder="Enter Amount to deposit" required>
          <small>Minimum Deposit UGX 15,000</small>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>

      <div id="details" class="details hidden">
        <div class="row" style="display: none;"><span>Reference</span><strong id="reference">—</strong></div>
        <div class="row"><span>Status</span><strong id="state">—</strong></div>
      </div>
      </form>
      
<button class="btn" id="payBtn" type="button">Pay Now</button>
      
    </section>
  </main>

  
  

  
    <script type="module" src="firestoreadminlogic.js"></script>
</body>
</html>
