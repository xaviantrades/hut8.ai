.announcement-header {
    position: relative;

/* Icon */

    flex-shrink: 0;

/* Title + subtitle */

.announcement-heading h2 {
    margin: 0 0 4px;

    color: #fff;

    font-size: 19px;

}

.announcement-heading p {

/* Small status */
.announcement-status {

    top: 10px;

    display: flex;
    align-items: center;
    gap: 4px;

    color: #00e676;

    text-transform: uppercase;

.announcement-status i {

}

    .message-list {
      max-width: 700px;
      margin: 0 auto;
      display: flex;

    }

.text-card {
    position: relative;

    width: 100%;
    box-sizing: border-box;

    padding: 25px 20px 25px 28px;

    color: #ffffff;
    background: transparent;

    line-height: 1.7;
    overflow-wrap: break-word;

    /* Remove the old full border */
    border: none;

    /* Optional subtle background */
    border-radius: 4px;

    box-shadow: none;
}


/* =========================
   LEFT DOUBLE LINES
========================= */

.text-card::before,
.text-card::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 2px;

    border-radius: 10px;

    background: #008cff;

    box-shadow:
        0 0 8px rgba(0, 140, 255, 0.45);
}


/* First line */
.text-card::before {
    left: 5px;
}


/* Second line */
.text-card::after {
    left: 11px;
}

    .text-card p {
      margin: 0;
      color: #ffffff;
      font-size: 1rem;
      white-space: pre-wrap;
    }

    }

  <script type="module">

    // ==================================================
    // FIREBASE
    // ==================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getFirestore,
        collection,
        query,
        orderBy,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==================================================
    // YOUR FIREBASE CONFIG
    // ==================================================

    const firebaseConfig = {
        apiKey: "AIzaSyCywqYls2mJfY9maHRhsHRTP6OmPgC1Kf0",
        authDomain: "x-shopping-6611d.firebaseapp.com",
        projectId: "x-shopping-6611d",
        storageBucket: "x-shopping-6611d.firebasestorage.app",
        messagingSenderId: "177602183210",
        appId: "1:177602183210:web:011c708002426b37cb8353",
        measurementId: "G-QKLP9H1N9P"
    };


    // ==================================================
    // INITIALIZE FIREBASE
    // ==================================================

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // ==================================================
    // LISTEN FOR BROADCAST MESSAGES
    // Ordered newest first, so the latest message
    // is always the top card on the page.
    // ==================================================

    const broadcastsQuery = query(
        collection(db, "broadcasts"),
        orderBy("createdAt", "desc")
    );


    onSnapshot(

        broadcastsQuery,

        (snapshot) => {

            const list =
                document.getElementById("message-list");


            if (snapshot.empty) {

                list.innerHTML =
                    '<p class="empty-state">No announcements yet.</p>';

                return;
            }


            list.innerHTML = "";


            snapshot.forEach((docSnap) => {

                const data = docSnap.data();

                const card =
                    document.createElement("div");

                card.className = "text-card";

                card.innerHTML = `
                    <p style="

  color:white;
  font-family:sans-serif;
  font-size:14px;
  line-height:1.4;
  padding:8px 12px;
  border-radius:8px;
  max-width:100%;
  margin:4px 0;
  box-shadow:0 1px 1px rgba(0,0,0,0.1);
  word-wrap:break-word;
">${escapeHtml(data.message || "")}</p>
                    <div class="message-time">${formatTime(data.createdAt)}</div>
                `;

                list.appendChild(card);

            });

        },


        (error) => {

            console.error(
                "Firestore error:",
                error
            );

            document.getElementById(
                "message-list"
            ).innerHTML =
                '<p class="empty-state">Failed to load messages.</p>';

        }

    );


    // ==================================================
    // FORMAT FIRESTORE TIMESTAMP
    // ==================================================

    function formatTime(timestamp) {

        if (!timestamp) {

            // serverTimestamp() is briefly null
            // right after a message is sent, before
            // the server has confirmed the write.
            return "Sending...";

        }


        if (
            typeof timestamp.toDate === "function"
        ) {

            return timestamp
                .toDate()
                .toLocaleString();

        }


        return timestamp;

    }


    // ==================================================
    // ESCAPE MESSAGE TEXT BEFORE INSERTING AS HTML
    // (messages come from the admin panel, so this
    // avoids any stray HTML/script being rendered)
    // ==================================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

  </script>
